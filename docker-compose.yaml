services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: pgpass
    volumes:
      - ./pgdata:/var/lib/postgresql/data 
      - ./database/db_init.sql:/docker-entrypoint-initdb.d/database.sql
    ports:
      - 5434:5432
 
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
 
volumes:
  pgdata: